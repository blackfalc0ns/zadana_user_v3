name: zadana_user_v3
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  fluttertoast: ^9.0.0
  get_it: ^9.2.1
  injectable: ^2.7.1+4
  json_annotation: ^4.11.0
  logger: ^2.6.2
  pretty_dio_logger: ^1.4.0
  retrofit: ^4.9.2
  shared_preferences: ^2.5.4
  flutter_secure_storage: ^10.0.0
  dio: ^5.9.2
  cached_network_image: ^3.4.1
  internet_connection_checker_plus: ^2.9.1+2
  google_fonts: ^8.0.2
  font_awesome_flutter: ^10.12.0
  file_picker: ^10.3.10
  url_launcher: ^6.3.2
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  permission_handler: ^11.0.1
  google_maps_flutter: ^2.14.2
  sign_in_with_apple: ^7.0.1
  google_sign_in: ^7.2.0
  flutter_signin_button: ^2.1.1
  device_preview: ^1.3.1
  flutter_animate: ^4.5.2
  either_dart: ^1.0.0
  latlong2: ^0.9.1
  flutter_map: ^8.2.2
  dartz: ^0.10.1
  persistent_bottom_nav_bar_v2: ^6.3.1
  flutter_svg: ^2.2.4
  iconsax: ^0.0.8
  lottie: ^3.3.2
  confetti: ^0.8.0
  webview_flutter: ^4.13.0

  intl: any
  dio_cache_interceptor: ^3.5.1
  dio_cache_interceptor_hive_store: ^4.0.0
  path_provider: ^2.1.5
  path: ^1.9.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.11.1
  injectable_generator: ^2.12.1
  json_serializable: ^6.13.0
  retrofit_generator: ^10.2.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/lottie_animation/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
