name: zadana_user_v3
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.10.7

dependencies:
  cached_network_image: ^3.4.1
  confetti: ^0.8.0
  dio: ^5.9.2
  dio_cache_interceptor: ^3.5.1
  file_picker: ^10.3.10
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_country_flags: ^0.0.1
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.2.2
  flutter_local_notifications: ^21.0.0
  flutter_secure_storage: ^10.0.0
  flutter_svg: ^2.2.4
  fluttertoast: ^9.0.0
  font_awesome_flutter: ^11.0.0
  geolocator: ^10.1.0
  get_it: ^9.2.1
  iconsax: ^0.0.8
  injectable: ^2.7.1+4
  image_picker: ^1.2.1
  intl: any
  json_annotation: ^4.11.0
  latlong2: ^0.9.1
  logger: ^2.6.2
  lottie: ^3.3.2
  onesignal_flutter: ^5.5.1
  package_info_plus: ^9.0.1
  persistent_bottom_nav_bar_v2: ^6.3.1
  retrofit: ^4.9.2
  shared_preferences: ^2.5.4
  signalr_netcore: ^1.4.4
  url_launcher: ^6.3.2
  moyasar: ^3.0.2
dev_dependencies:
  build_runner: ^2.11.1
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  image: ^4.8.0
  injectable_generator: ^2.12.1
  json_serializable: ^6.13.0
  retrofit_generator: ^10.2.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "assets/images/app_icon_background.png"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
  web:
    generate: false

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/lottie_animation/
    - assets/legal/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
